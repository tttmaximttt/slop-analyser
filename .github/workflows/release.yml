name: Release

# Every push to main that changes shipped files publishes package.json's version to npm and creates a
# GitHub release, unless that version is already on npm. Versions are bumped by hand in package.json and
# .claude-plugin/plugin.json; the tests check that they match.

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'agents/**'
      - 'skills/**'
      - 'hooks/**'
      - '.claude-plugin/**'
      - 'pricing.json'
      - 'package.json'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check whether this version is already published
        id: version
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later.
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      - if: steps.version.outputs.publish == 'true'
        run: npm test

      # Uses npm trusted publishing when it is set up for this repo; otherwise the NPM_TOKEN secret.
      - if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create the GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"
