name: Release

# Every push to main that changes shipped files publishes a new npm version and a GitHub release.
# Plugin users need nothing from this job: plugin.json has no version, so Claude Code treats each
# commit on main as a new plugin version.

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'src/**'
      - 'agents/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - 'pricing.json'
      - 'package.json'
  workflow_dispatch:
    inputs:
      level:
        description: Version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - run: npm test

      - name: Work out the version
        id: version
        env:
          LEVEL: ${{ inputs.level || 'auto' }}
        run: |
          published=$(npm view "$(node -p 'require("./package.json").name')" version 2>/dev/null || true)
          next=$(node scripts/next-version.mjs "$published" "$LEVEL")
          echo "Published: ${published:-none}, releasing: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ steps.version.outputs.version }}

      # Uses npm trusted publishing when it is set up for this repo; otherwise the NPM_TOKEN secret.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"
